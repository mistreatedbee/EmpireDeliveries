<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/brand/logo-black-bg.jpg" />
    <link rel="apple-touch-icon" href="/brand/logo-black-bg.jpg" />

    <!-- Primary meta -->
    <title>Empire Deliveries — Fast. Reliable. Royal.</title>
    <meta name="description" content="South Africa's premium on-demand delivery platform. Food, groceries, pharmacy, and courier — all in one app. Built for South Africans, by South Africans." />
    <meta name="keywords" content="Empire Deliveries, food delivery, grocery delivery, pharmacy delivery, courier, South Africa, Johannesburg, Cape Town, Durban" />
    <meta name="author" content="Empire Deliveries" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Empire Deliveries — Fast. Reliable. Royal." />
    <meta property="og:description" content="South Africa's premium on-demand delivery platform. Food, groceries, pharmacy, and courier in one app." />
    <meta property="og:image" content="/brand/logo-black-bg.jpg" />
    <meta property="og:site_name" content="Empire Deliveries" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Empire Deliveries — Fast. Reliable. Royal." />
    <meta name="twitter:description" content="South Africa's premium on-demand delivery platform." />
    <meta name="twitter:image" content="/brand/logo-black-bg.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0A0A0A;
        font-family: 'Inter', sans-serif;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      #splash.hidden { opacity: 0; pointer-events: none; }

      .splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 0 60px rgba(212,175,55,0.25);
        margin-bottom: 20px;
      }

      .splash-logo img { width: 100%; height: 100%; object-fit: cover; }

      .splash-wordmark {
        text-align: center;
        margin-bottom: 48px;
      }

      .splash-wordmark h1 {
        color: #fff;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.5px;
        line-height: 1;
      }

      .splash-wordmark p {
        color: #D4AF37;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-top: 4px;
      }

      .splash-dots {
        display: flex;
        gap: 8px;
      }

      .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #D4AF37;
        animation: pulse 1.2s ease-in-out infinite;
      }

      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }

      body { background: #0A0A0A; }
    </style>
  </head>
  <body>
    <!-- Branded loading screen — hidden once React mounts -->
    <div id="splash">
      <div class="splash-logo">
        <img src="/brand/logo-black-bg.jpg" alt="Empire Deliveries" />
      </div>
      <div class="splash-wordmark">
        <h1>EMPIRE</h1>
        <p>Deliveries</p>
      </div>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Hide splash once React has rendered
      document.addEventListener('DOMContentLoaded', function () {
        var observer = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var splash = document.getElementById('splash');
            if (splash) {
              splash.classList.add('hidden');
              setTimeout(function () { splash.remove(); }, 450);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
